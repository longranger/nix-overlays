name: "Nix Hash Fix & Build Check"

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Build & Update Hashes
        env:
          NIX_CONFIG: |
            http2 = true
            user-agent = nix-overlays-ci (github.com/${{ github.repository }})
            CARGO_HTTP_USER_AGENT: "nix-overlays-ci (github.com/${{ github.repository }})"
        run: |
          set -euo pipefail

          update_pkg_hash() {
            local file_name=$1
            local flake_attr=$2
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 0
            fi

            echo "==> Checking and fixing hashes for ${flake_attr} in ${file}..."

            # Loop up to 3 times to resolve sequential hash mismatches (src -> outputHashes -> rusty_v8)
            for i in {1..3}; do
              echo "  [Pass $i] Building .#${flake_attr}..."

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              BUILD_STATUS=$?
              set -e

              if [ $BUILD_STATUS -eq 0 ]; then
                echo "✅ ${flake_attr} built successfully!"
                break
              fi

              # Extract mismatched hashes from Nix's error output
              OLD_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "specified:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)
              NEW_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$OLD_HASH" ] && [ -n "$NEW_HASH" ]; then
                echo "  🔄 Replacing $OLD_HASH with $NEW_HASH"
                sed -i "s|$OLD_HASH|$NEW_HASH|g" "$file"
              else
                echo "⚠️ Build failed for reasons other than a hash mismatch:"
                echo "$BUILD_ERR" | tail -n 15
                break
              fi
            done
          }

          # Always run for every package in the overlay
          update_pkg_hash "goose" "goose"
          update_pkg_hash "kiro" "kiro"

      - name: Commit and Push Updated Hashes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain pkgs/) ]]; then
            echo "::notice::Hashes were updated. Committing changes..."
            git add pkgs/
            git commit -m "chore(auto-update): update SRI and cargo hashes"
            git push
          else
            echo "No hash changes detected. Everything is up to date."
          fi
