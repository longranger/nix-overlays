name: "Nix Hash Fixup & Build Check"

on:
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Build & Update Hashes
        env:
          NIX_CONFIG: |
            http2 = true
            user-agent = nix-overlays-ci (github.com/${{ github.repository }})
          CARGO_HTTP_USER_AGENT: "nix-overlays-ci (github.com/${{ github.repository }})"
        run: |
          set -euo pipefail

          update_pkg_hash() {
            local file_name=$1
            local flake_attr=$2
            local target_attr=$3
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 0
            fi

            # 1. First, handle any target_attr (e.g. hash = "...")
            if grep -q -E "${target_attr}\s*=\s*\"" "$file"; then
              echo "==> Testing ${flake_attr} -> ${target_attr} in ${file}..."
              sed -i -E "s|(${target_attr}\s*=\s*\")[^\"]*(\";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|" "$file" || true
              git add "$file" || true

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              BUILD_STATUS=$?
              set -e

              NEW_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$NEW_HASH" ]; then
                echo "✅ Found updated ${target_attr} for ${flake_attr}: ${NEW_HASH}"
                sed -i -E "s|(${target_attr}\s*=\s*\")[^\"]*(\";)|\1${NEW_HASH}\2|" "$file" || true
                git add "$file" || true
              else
                echo "⚠️ Could not extract hash mismatch for ${flake_attr} (${target_attr})."
                git checkout -- "$file" || true
              fi
            fi

            # 2. Next, check if the file contains outputHashes (git dependencies in Cargo.lock)
            if grep -q "outputHashes" "$file"; then
              echo "==> Testing ${flake_attr} -> outputHashes in ${file}..."
              # Replace any existing hashes inside outputHashes block with dummy hash
              sed -i -E '/outputHashes/,/};/ s|(=\s*")[^"]*(";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|g' "$file" || true
              git add "$file" || true

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              set -e

              NEW_OUTPUT_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$NEW_OUTPUT_HASH" ]; then
                echo "✅ Found updated outputHash for ${flake_attr}: ${NEW_OUTPUT_HASH}"
                sed -i -E "/outputHashes/,/};/ s|(=\s*\")[^\"]*(\";)|\1${NEW_OUTPUT_HASH}\2|g" "$file" || true
                git add "$file" || true
              else
                echo "⚠️ Could not extract outputHash mismatch for ${flake_attr}."
                git checkout -- "$file" || true
              fi
            fi
          }

          # Check if goose.nix changed in the branch/commit or if triggered manually/via cron
          SHOULD_CHECK_GOOSE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            SHOULD_CHECK_GOOSE=true
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q "pkgs/goose.nix"; then
              SHOULD_CHECK_GOOSE=true
            fi
          else
            SHOULD_CHECK_GOOSE=true
          fi

          if [ "$SHOULD_CHECK_GOOSE" = true ]; then
            # File name: goose, Flake attr: goose
            update_pkg_hash "goose" "goose" "hash"
          fi

          # File name: kiro, Flake attr: kiro
          update_pkg_hash "kiro" "kiro" "hash"

      - name: Commit and Push Updated Hashes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain pkgs/) ]]; then
            git add pkgs/
            git commit -m "chore(auto-update): update SRI and cargo hashes"
            git push
          else
            echo "No hash changes detected."
          fi
