name: "Nix Hash Fixup & Build Check"

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Build & Update Hashes
        env:
          NIX_CONFIG: |
            http2 = true
            user-agent = nix-overlays-ci (github.com/${{ github.repository }})
          CARGO_HTTP_USER_AGENT: "nix-overlays-ci (github.com/${{ github.repository }})"
        run: |
          set -euo pipefail

          update_pkg_hash() {
            local file_name=$1
            local flake_attr=$2
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 0
            fi

            echo "==> Resolving hashes for ${flake_attr} in ${file}..."

            # Max 5 iterations to resolve src, outputHashes, rusty_v8_lib, etc.
            local max_iterations=5
            local iter=0

            while [ $iter -lt $max_iterations ]; do
              iter=$((iter + 1))
              echo "  [Attempt $iter/$max_iterations] Building .#${flake_attr}..."

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              BUILD_STATUS=$?
              set -e

              if [ $BUILD_STATUS -eq 0 ]; then
                echo "✅ ${flake_attr} built successfully!"
                break
              fi

              # Extract expected vs got hash mismatch from Nix output
              # Nix outputs: "specified: sha256-...\n got: sha256-..."
              OLD_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "specified:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)
              NEW_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$OLD_HASH" ] && [ -n "$NEW_HASH" ]; then
                echo "  🔄 Replacing $OLD_HASH with $NEW_HASH"
                sed -i "s|$OLD_HASH|$NEW_HASH|g" "$file"
                git add "$file"
              else
                # If there is no hash mismatch (e.g. syntax error or actual build failure), stop looping
                echo "⚠️ Build failed without a hash mismatch error:"
                echo "$BUILD_ERR" | tail -n 20
                break
              fi
            done
          }

          # Determine scope based on event type
          SHOULD_CHECK_ALL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            SHOULD_CHECK_ALL=true
          fi

          if [ "$SHOULD_CHECK_ALL" = true ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "pkgs/goose.nix"; then
            update_pkg_hash "goose" "goose" "hash"
          fi

          if [ "$SHOULD_CHECK_ALL" = true ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "pkgs/kiro.nix"; then
            update_pkg_hash "kiro" "kiro" "hash"
          fi

      - name: Commit and Push Updated Hashes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain pkgs/) ]]; then
            git add pkgs/
            git commit -m "chore(auto-update): update SRI and cargo hashes"
            git push
          else
            echo "No hash changes detected."
          fi
