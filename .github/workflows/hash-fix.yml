name: "Nix Hash Fixup & Build Check"

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Build & Update Hashes
        env:
          NIX_CONFIG: |
            http2 = true
            user-agent = nix-overlays-ci (github.com/${{ github.repository }})
          CARGO_HTTP_USER_AGENT: "nix-overlays-ci (github.com/${{ github.repository }})"
        run: |
          set -euo pipefail

          update_pkg_hash() {
            local file_name=$1
            local flake_attr=$2
            local target_attr=$3
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 0
            fi

            # -------------------------------------------------------------------
            # STEP 1: Primary Source Hash (scoped specifically to `src = ...`)
            # -------------------------------------------------------------------
            if grep -q "src = " "$file"; then
              echo "==> [1/3] Testing ${flake_attr} -> src.hash in ${file}..."
              sed -i -E '/src = /,/};/ s|(hash\s*=\s*")[^"]*(";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|g' "$file" || true
              git add "$file" || true

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              set -e

              NEW_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$NEW_HASH" ]; then
                echo "✅ Found updated src.hash for ${flake_attr}: ${NEW_HASH}"
                sed -i -E "/src = /,/};/ s|(hash\s*=\s*\")[^\"]*(\";)|\1${NEW_HASH}\2|g" "$file" || true
                git add "$file" || true
              fi
            fi

            # -------------------------------------------------------------------
            # STEP 2: Cargo outputHashes (git dependencies in Cargo.lock)
            # -------------------------------------------------------------------
            if grep -q "outputHashes" "$file"; then
              echo "==> [2/3] Testing ${flake_attr} -> outputHashes in ${file}..."
              sed -i -E '/outputHashes/,/};/ s|(=\s*")[^"]*(";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|g' "$file" || true
              git add "$file" || true

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              set -e

              NEW_OUTPUT_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$NEW_OUTPUT_HASH" ]; then
                echo "✅ Found updated outputHash for ${flake_attr}: ${NEW_OUTPUT_HASH}"
                sed -i -E "/outputHashes/,/};/ s|(=\s*\")[^\"]*(\";)|\1${NEW_OUTPUT_HASH}\2|g" "$file" || true
                git add "$file" || true
              else
                echo "⚠️ Could not extract outputHash mismatch for ${flake_attr}."
                git checkout -- "$file" || true
              fi
            fi

            # -------------------------------------------------------------------
            # STEP 3: V8 Static Archive Hash (rusty_v8_lib)
            # -------------------------------------------------------------------
            if grep -q "rusty_v8_lib" "$file"; then
              echo "==> [3/3] Testing ${flake_attr} -> rusty_v8_lib hash in ${file}..."
              sed -i -E '/rusty_v8_lib/,/};/ s|(hash\s*=\s*")[^"]*(";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|g' "$file" || true
              git add "$file" || true

              set +e
              BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1)
              set -e

              NEW_V8_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$NEW_V8_HASH" ]; then
                echo "✅ Found updated rusty_v8_lib hash for ${flake_attr}: ${NEW_V8_HASH}"
                sed -i -E "/rusty_v8_lib/,/};/ s|(hash\s*=\s*\")[^\"]*(\";)|\1${NEW_V8_HASH}\2|g" "$file" || true
                git add "$file" || true
              else
                echo "⚠️ Could not extract rusty_v8_lib hash mismatch for ${flake_attr}."
                git checkout -- "$file" || true
              fi
            fi
          }

          # Determine scope based on event type
          SHOULD_CHECK_ALL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            SHOULD_CHECK_ALL=true
          fi

          if [ "$SHOULD_CHECK_ALL" = true ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "pkgs/goose.nix"; then
            update_pkg_hash "goose" "goose" "hash"
          fi

          if [ "$SHOULD_CHECK_ALL" = true ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "pkgs/kiro.nix"; then
            update_pkg_hash "kiro" "kiro" "hash"
          fi

      - name: Commit and Push Updated Hashes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain pkgs/) ]]; then
            git add pkgs/
            git commit -m "chore(auto-update): update SRI and cargo hashes"
            git push
          else
            echo "No hash changes detected."
          fi
