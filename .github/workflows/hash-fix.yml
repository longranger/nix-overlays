name: "Nix Hash Fix & Build Check"

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update Flake Lockfile
        run: |
          echo "==> Updating flake inputs..."
          nix flake update nixpkgs

      - name: Test Build & Update Hashes
        env:
          CARGO_HTTP_USER_AGENT: "nix-overlays-ci (github.com/${{ github.repository }})"
          NIX_CONFIG: |
            http2 = true
            user-agent = nix-overlays-ci (github.com/${{ github.repository }})
        run: |
          set -euo pipefail

          FAILED_BUILDS=0

          update_pkg_hash() {
            local file_name=$1
            local flake_attr=$2
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 0
            fi

            echo "==> Checking and fixing hashes for ${flake_attr} in ${file}..."

            local SUCCESS=false

            for i in {1..3}; do
              echo "  [Pass $i] Building .#${flake_attr}..."

              set +e
              nix build ".#${flake_attr}" 2>&1 | tee "$LOG_FILE"
              BUILD_STATUS=${PIPESTATUS[0]}
              set -e

              BUILD_ERR=$(cat "$LOG_FILE")
              rm -f "$LOG_FILE"

              if [ $BUILD_STATUS -eq 0 ]; then
                echo "✅ ${flake_attr} built successfully!"
                SUCCESS=true
                break
              fi

              # Extract mismatched hashes from Nix's error output
              OLD_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "specified:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)
              NEW_HASH=$(echo "$BUILD_ERR" | grep -A 2 "hash mismatch" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1 || true)

              if [ -n "$OLD_HASH" ] && [ -n "$NEW_HASH" ]; then
                echo "  🔄 Replacing $OLD_HASH with $NEW_HASH in $file"
                sed -i "s|$OLD_HASH|$NEW_HASH|g" "$file"
              else
                echo "❌ Build failed for reasons other than a hash mismatch:"
                echo "$BUILD_ERR" | tail -n 20
                break
              fi
            done

            if [ "$SUCCESS" = false ]; then
              FAILED_BUILDS=$((FAILED_BUILDS + 1))
            fi
          }

          update_pkg_hash "goose" "goose"
          update_pkg_hash "kiro" "kiro"

          if [ $FAILED_BUILDS -gt 0 ]; then
            echo "❌ $FAILED_BUILDS package(s) failed to build."
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage both pkgs/ directory changes AND flake.lock
          git add pkgs/ flake.lock

          if ! git diff --cached --quiet; then
            echo "::notice::Changes detected in pkgs/ or flake.lock. Committing..."
            git commit -m "chore(auto-update): update nixpkgs flake inputs and package hashes"
            git push
          else
            echo "No changes detected in flake.lock or package hashes."
          fi
