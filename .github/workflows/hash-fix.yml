name: "Nix Hash Fixup & Build Check"

on:
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Build & Update Hashes
        run: |
          set -euo pipefail

          update_pkg_hash() {
            local file_name=$1    # e.g., "goose" (for pkgs/goose.nix)
            local flake_attr=$2   # e.g., "goose-cli" (for .#goose-cli)
            local target_attr=$3  # e.g., "hash" or "cargoHash"
            local file="pkgs/${file_name}.nix"

            if [ ! -f "$file" ]; then
              echo "❌ File $file does not exist. Skipping."
              return 1
            fi

            echo "==> Testing ${flake_attr} -> ${target_attr} in ${file}..."

            # Force a hash mismatch to harvest the actual hash from Nix output
            sed -i -E "s|(${target_attr}\s*=\s*\")sha256-[^\"]*(\";)|\1sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\2|" "$file"

            # Capture nix build output; allow error so set -e doesn't break the script
            BUILD_ERR=$(nix build ".#${flake_attr}" 2>&1 || true)
            NEW_HASH=$(echo "$BUILD_ERR" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -n 1)

            if [ -n "$NEW_HASH" ]; then
              echo "✅ Found updated ${target_attr} for ${flake_attr}: ${NEW_HASH}"
              sed -i -E "s|(${target_attr}\s*=\s*\")sha256-[^\"]*(\";)|\1${NEW_HASH}\2|" "$file"
            else
              echo "⚠️ Could not extract hash mismatch for ${flake_attr} (${target_attr}). Restoring original file state."
              git checkout -- "$file"
            fi
          }

          # Check if goose.nix changed in the branch/commit or if triggered manually/via cron
          SHOULD_CHECK_GOOSE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            SHOULD_CHECK_GOOSE=true
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q "pkgs/goose.nix"; then
              SHOULD_CHECK_GOOSE=true
            fi
          else
            SHOULD_CHECK_GOOSE=true
          fi

          if [ "$SHOULD_CHECK_GOOSE" = true ]; then
            # File name: goose, Flake attr: goose-cli
            update_pkg_hash "goose" "goose-cli" "hash"
            update_pkg_hash "goose" "goose-cli" "cargoHash"
          fi

          # File name: kiro, Flake attr: kiro-cli
          update_pkg_hash "kiro" "kiro-cli" "hash"

      - name: Commit and Push Updated Hashes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain pkgs/) ]]; then
            git add pkgs/
            git commit -m "chore(auto-update): update SRI and cargo hashes"
            git push
          else
            echo "No hash changes detected."
          fi
